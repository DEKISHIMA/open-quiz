<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPEN QUIZ</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}main{max-width:1200px;margin:auto;padding:28px 22px}.hidden{display:none!important}.panel{background:#fff;border:1px solid #c9cdd3;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 2px 12px #00000008}h1{font-size:38px;margin:8px 0}h2{margin-top:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:13px 17px;margin:4px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#111827;color:#fff}.danger{background:#b42318;color:#fff}.big{width:100%;font-size:22px;padding:18px}.muted{color:#596273}.notice{padding:13px;background:#fafafa;border:1px solid #d2d6dc;border-radius:12px;margin-top:10px}.statusLine{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.setCard{background:#fff;border:1px solid #d7dbe0;border-radius:16px;padding:16px}.setActions{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.setActions button{margin:0}.setEditorQuestion{background:#fff;border:1px solid #d7dbe0;border-radius:15px;padding:14px;margin:12px 0}.setThumb{max-width:180px;max-height:100px;display:block;margin-top:7px;border-radius:10px;background:#fff}.setupImg{font-size:13px;color:#596273;margin:2px 4px 8px}.setEditorQuestion textarea,.setEditorQuestion input,.additionalEditor input{width:100%;border:2px solid #555;border-radius:12px;padding:12px;background:#fff;margin:6px 0}.screen{min-height:70vh;display:flex;flex-direction:column}.gameTop{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.questionNo{font-size:22px;font-weight:900}.timers{display:flex;gap:12px;align-items:center}.timerBox{border:2px solid #111;border-radius:14px;padding:8px 14px;text-align:center;background:#fff}.timerLabel{font-size:12px;font-weight:800}.timer{font-size:42px;font-weight:1000;line-height:1}.timer.warn{font-size:50px}.questionArea{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 5px}.questionText{font-size:clamp(42px,6vw,84px);font-weight:1000;line-height:1.2;white-space:pre-wrap;word-break:break-word}.questionImage{max-width:100%;max-height:48vh;object-fit:contain;margin-top:18px}.gameControls{display:flex;gap:8px;flex-wrap:wrap}.gameControls button{flex:1;min-width:220px}.scoreGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.scoreCard{border:2px solid #111;border-radius:18px;padding:15px;background:#fff;text-align:center}.seat{font-size:24px;font-weight:1000}.totalScore{font-size:32px;font-weight:1000;margin:5px 0 12px}.pointBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pointBtns button{margin:0;font-size:22px;padding:12px}.currentPoint{font-size:18px;font-weight:900;margin-bottom:8px}.resultRow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding:14px 8px;font-size:24px}.rank{font-weight:1000}.scoreBig{font-weight:1000}.phaseTitle{font-size:clamp(38px,6vw,72px);font-weight:1000;text-align:center;margin:12px 0}.hintText{font-size:18px;text-align:center}.topTimerNote{font-size:14px;color:#596273}.gameBadge{font-size:18px;font-weight:900;background:#f7f7f7;padding:8px 12px;border-radius:12px}.smallBtn{padding:9px 12px;font-size:14px}.endbar{display:flex;gap:8px;justify-content:center;margin-top:20px}@media(max-width:800px){.scoreGrid{grid-template-columns:repeat(2,1fr)}.gameTop{flex-direction:column}.timers{width:100%}.timerBox{flex:1}.questionText{font-size:clamp(34px,9vw,60px)}}
</style></head><body><main>
<section id="app" class="hidden">
<div class="statusLine"><div><h1>OPEN QUIZ</h1><div class="muted">席番号 1〜8・ホワイトボード回答・目視採点</div></div></div>
<div id="library" class="panel"><h2>📚 保存済みクイズ</h2><div class="muted">大会前に作った5問セットがここに保存されています。ここから1セット選んで、そのままゲームを開始します。</div><div class="statusLine" style="margin-top:12px"><b>5問セット</b><button id="newSet">＋ 新しい5問セット</button></div><div id="setList" class="grid"></div><div id="setEditor" class="hidden"><hr><h3 id="setEditorTitle">新しい5問セット</h3><input id="setName" placeholder="セット名"><div id="setInputs"></div><button id="saveSet" class="primary big">保存する</button><button id="cancelSet">キャンセル</button><div id="setNotice" class="notice hidden"></div></div></div>
<div id="additionalLibrary" class="panel"><h2>➕ 追加問題</h2><div class="muted">5問終了後、必要ならここから追加問題を出します。追加問題は1問2分30秒です。</div><div class="statusLine" style="margin-top:12px"><b>保存済み追加問題</b><button id="newAdditional">＋ 追加問題を登録</button></div><div id="additionalList" class="grid"></div><div id="additionalEditor" class="hidden"><hr><h3 id="additionalEditorTitle">追加問題</h3><input id="additionalText" placeholder="問題文"><input id="additionalImg" type="file" accept="image/*"><div id="additionalImgNote" class="setupImg">問題画像（任意）</div><img id="additionalPreview" class="setThumb hidden"><button id="saveAdditional" class="primary big">保存する</button><button id="cancelAdditional">キャンセル</button><div id="additionalNotice" class="notice hidden"></div></div></div>
<div id="game" class="hidden"></div>
</section></main><script>
const $=id=>document.getElementById(id);let sets=[],additional=[],editingSetId=null,editingAdditionalId=null,editingAdditionalImage='';let game=null,timer=null,gameTimer=null;
const QUESTION_SECONDS=80,ADDITIONAL_SECONDS=150,GAME_SECONDS=900;
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function show(id,on=true){$(id).classList.toggle('hidden',!on)}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function imgCompress(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!file.type.startsWith('image/'))return reject();const fr=new FileReader();const im=new Image();fr.onload=()=>{im.onload=()=>{let w=im.width,h=im.height,max=1800;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.8))};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
async function api(url,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});const r=await fetch(url,opt);let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'通信に失敗しました。');return j}
async function loadAll(){await Promise.all([loadSets(),loadAdditional()])}
async function loadSets(){try{sets=await api('/api/problem-sets');renderSets()}catch(e){alert(e.message)}}
async function loadAdditional(){try{additional=await api('/api/additional-problems');renderAdditional()}catch(e){alert(e.message)}}
function renderSets(){const d=$('setList');if(!sets.length){d.innerHTML='<div class="notice">まだ5問セットがありません。</div>';return}d.innerHTML=sets.map(x=>`<div class="setCard"><div style="font-size:24px;font-weight:900">${esc(x.name)}</div><div class="muted">5問・保存済み</div><div class="setActions"><button data-use="${esc(x.id)}" class="primary">▶ このセットで開始</button><button data-edit="${esc(x.id)}">✏️ 編集</button><button data-del="${esc(x.id)}">🗑️ 削除</button></div></div>`).join('');d.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>startGame(b.dataset.use));d.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openSetEditor(sets.find(x=>x.id===b.dataset.edit)));d.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('この5問セットを削除しますか？'))return;try{await api('/api/problem-sets/'+b.dataset.del,{method:'DELETE'});await loadSets()}catch(e){alert(e.message)}})}
function makeSetInputs(qs=[]){const d=$('setInputs');d.innerHTML='';for(let i=0;i<5;i++){const q=qs[i]||{text:'',image:''};const w=document.createElement('div');w.className='setEditorQuestion';w.innerHTML=`<b>第${i+1}問</b><textarea data-q rows="4" placeholder="問題文（改行できます）"></textarea><input data-img type="file" accept="image/*"><div class="setupImg">問題画像（任意）</div><img data-preview class="setThumb hidden">`;w.querySelector('[data-q]').value=q.text||'';if(q.image){w.dataset.image=q.image;w.querySelector('[data-preview]').src=q.image;showEl(w.querySelector('[data-preview]'),true)}w.querySelector('[data-img]').onchange=async e=>{try{const data=await imgCompress(e.target.files[0]);w.dataset.image=data;w.querySelector('[data-preview]').src=data;showEl(w.querySelector('[data-preview]'),true)}catch(err){alert('画像を読み込めませんでした。')}};d.appendChild(w)}}
function showEl(e,on){e.classList.toggle('hidden',!on)}
function openSetEditor(x){editingSetId=x?.id||null;$('setEditorTitle').textContent=editingSetId?'5問セットを編集':'新しい5問セット';$('setName').value=x?.name||'';$('setNotice').textContent='';show('setNotice',false);makeSetInputs(x?.questions||[]);show('setEditor');$('setName').focus()}
$('newSet').onclick=()=>openSetEditor(null);$('cancelSet').onclick=()=>{show('setEditor',false);editingSetId=null};
$('saveSet').onclick=async()=>{const name=$('setName').value.trim();const qs=[...document.querySelectorAll('.setEditorQuestion')].map(w=>({text:w.querySelector('[data-q]').value.trim(),image:w.dataset.image||''}));if(!name||qs.some(q=>!q.text)){show('setNotice');$('setNotice').textContent='セット名と5問すべてを入力してください。';return}const b=$('saveSet');b.disabled=true;try{const url=editingSetId?'/api/problem-sets/'+editingSetId:'/api/problem-sets';await api(url,{method:editingSetId?'PUT':'POST',body:JSON.stringify({name,questions:qs})});show('setEditor',false);editingSetId=null;await loadSets()}catch(e){show('setNotice');$('setNotice').textContent=e.message}finally{b.disabled=false}};
function renderAdditional(){const d=$('additionalList');if(!additional.length){d.innerHTML='<div class="notice">まだ追加問題がありません。</div>';return}d.innerHTML=additional.map(x=>`<div class="setCard"><div style="font-size:20px;font-weight:900;white-space:pre-wrap">${esc(x.text)}</div>${x.image?`<img class="setThumb" src="${esc(x.image)}">`:''}<div class="setActions"><button data-ae="${esc(x.id)}">✏️ 編集</button><button data-ad="${esc(x.id)}">🗑️ 削除</button></div></div>`).join('');d.querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>openAdditionalEditor(additional.find(x=>x.id===b.dataset.ae)));d.querySelectorAll('[data-ad]').forEach(b=>b.onclick=async()=>{if(!confirm('この追加問題を削除しますか？'))return;try{await api('/api/additional-problems/'+b.dataset.ad,{method:'DELETE'});await loadAdditional()}catch(e){alert(e.message)}})}
function openAdditionalEditor(x){editingAdditionalId=x?.id||null;editingAdditionalImage=x?.image||'';$('additionalEditorTitle').textContent=editingAdditionalId?'追加問題を編集':'追加問題を登録';$('additionalText').value=x?.text||'';$('additionalImg').value='';$('additionalPreview').src=editingAdditionalImage;show('additionalPreview',!!editingAdditionalImage);$('additionalImgNote').textContent=editingAdditionalImage?'保存済み画像を使用中。新しい画像で置き換えできます。':'問題画像（任意）';show('additionalNotice',false);show('additionalEditor');$('additionalText').focus()}
$('newAdditional').onclick=()=>openAdditionalEditor(null);$('cancelAdditional').onclick=()=>{show('additionalEditor',false);editingAdditionalId=null;editingAdditionalImage=''};$('additionalImg').onchange=async e=>{try{editingAdditionalImage=await imgCompress(e.target.files[0]);$('additionalPreview').src=editingAdditionalImage;show('additionalPreview',true);$('additionalImgNote').textContent='新しい画像を使用します'}catch(err){alert('画像を読み込めませんでした。')}};$('saveAdditional').onclick=async()=>{const text=$('additionalText').value.trim();if(!text){show('additionalNotice');$('additionalNotice').textContent='問題文を入力してください。';return}try{const url=editingAdditionalId?'/api/additional-problems/'+editingAdditionalId:'/api/additional-problems';await api(url,{method:editingAdditionalId?'PUT':'POST',body:JSON.stringify({text,image:editingAdditionalImage})});show('additionalEditor',false);await loadAdditional()}catch(e){show('additionalNotice');$('additionalNotice').textContent=e.message}};
function startGame(setId){const set=sets.find(x=>x.id===setId);if(!set)return;game={setName:set.name,questions:set.questions.map(q=>({...q,additional:false})),current:0,scores:Array(8).fill(0),currentPoints:Array(8).fill(null),questionLeft:QUESTION_SECONDS,gameLeft:GAME_SECONDS,phase:'answer',additionalCount:0};$('library').classList.add('hidden');$('additionalLibrary').classList.add('hidden');show('game');renderGame();startTimers()}
function renderGame(){if(!game)return;const q=game.questions[game.current];if(game.phase==='answer')renderAnswer(q);else if(game.phase==='score')renderScore();else if(game.phase==='choice')renderChoice();else renderFinal()}
function renderAnswer(q){$('game').innerHTML=`<div class="panel screen"><div class="gameTop"><div><div class="questionNo">第${game.current+1}問 / ${game.questions.length}</div><div class="gameBadge">${esc(game.setName)}</div></div><div class="timers"><div class="timerBox"><div class="timerLabel">1問の制限時間</div><div id="qTimer" class="timer">${fmt(game.questionLeft)}</div></div><div class="timerBox"><div class="timerLabel">クイズの目安時間</div><div id="gTimer" class="timer">${fmt(game.gameLeft)}</div></div></div></div><div class="questionArea"><div class="questionText">${esc(q.text)}</div>${q.image?`<img class="questionImage" src="${esc(q.image)}">`:''}</div><div class="gameControls"><button id="finishQuestion" class="primary big">📝 回答終了 → 採点へ</button><button id="abortGame">ゲームを終了</button></div><div class="topTimerNote">回答者は1〜8の席番号で管理します。ホワイトボードを目視で採点してください。</div></div>`;$('finishQuestion').onclick=()=>goScore('manual');$('abortGame').onclick=confirmEnd}
function renderScore(){stopTimers();const q=game.questions[game.current];$('game').innerHTML=`<div class="panel"><div class="statusLine"><div><div class="questionNo">第${game.current+1}問：採点</div><div class="gameBadge">「追加点数」を1〜8の席番号に入れてください</div></div><div class="gameBadge">1問 5点満点</div></div><div class="notice">ホワイトボードを目視して、各席の今回の点数を 0〜5 点から選択します。選んだ点はすぐ合計点に反映されます。</div><div class="scoreGrid" style="margin-top:16px">${game.scores.map((s,i)=>`<div class="scoreCard"><div class="seat">席 ${i+1}</div><div class="totalScore">合計 ${s}点</div><div class="currentPoint">今回：${game.currentPoints[i]===null?'未採点':game.currentPoints[i]+'点'}</div><div class="pointBtns">${[0,1,2,3,4,5].map(p=>`<button data-seat="${i}" data-point="${p}">${p}点</button>`).join('')}</div></div>`).join('')}</div><div class="endbar"><button id="scoreNext" class="primary big" disabled>次の問題へ</button></div></div>`;document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{const i=+b.dataset.seat,p=+b.dataset.point;if(game.currentPoints[i]!==null)game.scores[i]-=game.currentPoints[i];game.currentPoints[i]=p;game.scores[i]+=p;renderScore()});$('scoreNext').disabled=game.currentPoints.some(x=>x===null);$('scoreNext').onclick=nextAfterScore}
function goScore(reason){if(game.phase!=='answer')return;stopTimers();game.phase='score';game.currentPoints=Array(8).fill(null);renderScore()}
function nextAfterScore(){if(game.current===game.questions.length-1){game.phase='choice';renderChoice();return}game.current++;game.currentPoints=Array(8).fill(null);game.questionLeft=game.questions[game.current].additional?ADDITIONAL_SECONDS:QUESTION_SECONDS;game.phase='answer';renderGame();startTimers()}
function renderChoice(){$('game').innerHTML=`<div class="panel screen"><div class="phaseTitle">第${game.current+1}問まで終了</div><div class="notice" style="text-align:center;font-size:22px">ここからどうするか選んでください。</div><div class="gameControls" style="margin-top:30px"><button id="addQ" class="primary big">➕ 追加問題を出す</button><button id="showFinal" class="big">🏆 結果発表</button></div><div class="notice">追加問題は1問2分30秒・1問5点満点です。追加するたびに最後に結果へ戻れます。</div></div>`;if(!additional.length)$('addQ').disabled=true;$('addQ').onclick=chooseAdditional;$('showFinal').onclick=()=>{game.phase='final';renderFinal()}}
function chooseAdditional(){$('game').innerHTML=`<div class="panel"><h2>➕ 追加問題を選択</h2><select id="addSelect" style="width:100%;padding:14px;border:2px solid #555;border-radius:12px">${additional.map(x=>`<option value="${esc(x.id)}">${esc(x.text)}</option>`).join('')}</select><button id="addStart" class="primary big">この追加問題を出題する</button><button id="backChoice">戻る</button></div>`;$('addStart').onclick=()=>{const x=additional.find(a=>a.id===$('addSelect').value);if(!x)return;game.questions.push({...x,additional:true});game.current=game.questions.length-1;game.questionLeft=ADDITIONAL_SECONDS;game.currentPoints=Array(8).fill(null);game.phase='answer';renderGame();startTimers()};$('backChoice').onclick=renderChoice}
function renderFinal(){stopTimers();const rows=game.scores.map((score,i)=>({seat:i+1,score})).sort((a,b)=>b.score-a.score||a.seat-b.seat);let rank=0,last=null;rows.forEach((r,i)=>{if(r.score!==last)rank=i+1;r.rank=rank;last=r.score});$('game').innerHTML=`<div class="panel"><div class="phaseTitle">🏆 最終結果</div><div class="muted" style="text-align:center">${esc(game.setName)}</div><div style="margin-top:20px">${rows.map(r=>`<div class="resultRow"><span class="rank">${r.rank}位　席 ${r.seat}</span><span class="scoreBig">${r.score}点</span></div>`).join('')}</div><div class="endbar"><button id="finishAll" class="danger big">🏁 ゲーム終了</button></div></div>`;$('finishAll').onclick=confirmEnd}
function startTimers(){stopTimers();timer=setInterval(()=>{if(game.phase!=='answer')return;game.questionLeft=Math.max(0,game.questionLeft-1);game.gameLeft=Math.max(0,game.gameLeft-1);updateTimers();if(game.questionLeft===0){goScore('question');}else if(game.gameLeft===0){goScore('game')}},1000);updateTimers()}
function updateTimers(){const q=$('qTimer'),g=$('gTimer');if(q){q.textContent=fmt(game.questionLeft);q.classList.toggle('warn',game.questionLeft<=15)}if(g)g.textContent=fmt(game.gameLeft)}
function stopTimers(){if(timer){clearInterval(timer);timer=null}if(gameTimer){clearInterval(gameTimer);gameTimer=null}}
function confirmEnd(){if(confirm('ゲームを終了して結果画面に戻ります。よろしいですか？')){stopTimers();game=null;$('game').classList.add('hidden');$('library').classList.remove('hidden');$('additionalLibrary').classList.remove('hidden');}}
show('app');loadAll().catch(e=>alert(e.message));</script></body></html>
